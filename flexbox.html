<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>फ्लेक्सबॉक्स</title>
  <style>
    .bahar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      background-color: lightgray;
      height: 200px;
    }
    .dibba {
      width: 80px;
      height: 80px;
      color: white;
      text-align: center;
      line-height: 80px;
    }
    .lal { background-color: red; }
    .hara { background-color: green; }
    .neela { background-color: blue; }
  </style>
</head>
<body>
  <div class="bahar">
    <div class="dibba lal">1</div>
    <div class="dibba hara">2</div>
    <div class="dibba neela">3</div>
  </div>
</body>
</html>
