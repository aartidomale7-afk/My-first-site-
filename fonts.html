<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>फॉन्ट और टेक्स्ट</title>
  <style>
    h1 {
      font-family: Arial, sans-serif;
      font-size: 40px;
      color: darkblue;
      text-align: center;
    }
    .bada {
      font-size: 20px;
      font-weight: bold;
    }
    .tirchha {
      font-style: italic;
      color: purple;
    }
    .line {
      text-decoration: underline;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <h1>मेरा फॉन्ट पेज</h1>
  <p class="bada">यह मोटा और बड़ा लिखा है।</p>
  <p class="tirchha">यह तिरछा और हरा लिखा है।</p>
  <p class="line">this line has underline and capital letters</p>
</body>
</html>
